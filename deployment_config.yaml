http:
  port: 8000
  health_check_path: /health
name: AI PR Description Bot
summary: GitHub App that generates PR descriptions using AI
environment_variables:
  - name: GITHUB_WEBHOOK_SECRET
    value: <your_github_webhook_secret>
    description: The secret key for verifying GitHub webhook signatures, ensuring that incoming requests are legitimate.
  - name: GITHUB_APP_ID
    value: <your_github_app_id>
    description: The ID of your GitHub App, required for generating JWT tokens for authentication with the GitHub API.
  - name: GITHUB_PRIVATE_KEY_PATH
    value: <path_to_your_private_key>
    description: Optional. The file path to the GitHub App's private key. If provided, the application will load the key from this path.
  - name: GITHUB_PRIVATE_KEY
    value: <your_github_private_key_content>
    description: Optional. The content of the GitHub App's private key. If provided, this will be used instead of GITHUB_PRIVATE_KEY_PATH. Essential for signing JWT tokens.
  - name: OPENAI_API_KEY
    value: <your_openai_api_key>
    description: The API key for authenticating requests to the OpenAI API.
  - name: OPENAI_BASE_URL
    value: https://api.openai.com/v1
    description: The base URL for the OpenAI API. Defaults to 'https://api.openai.com/v1'.
  - name: DEFAULT_MODEL_NAME
    value: gpt-4-turbo-preview
    description: The default AI model to be used for generating descriptions. Defaults to 'gpt-4-turbo-preview'.